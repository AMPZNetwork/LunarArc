
plugins {
    id 'com.gradleup.shadow'
}

dependencies {
    implementation project(':installer')
    implementation project(':lunararc-common')
    implementation project(':lunararc-api')
    implementation project(':i18n-config')

    implementation libs.paper.api
    implementation libs.bungeecord.chat.api

    implementation libs.sqlite.jdbc
    // Real Paper/Spigot bundle a MySQL driver by default since it's such a common plugin
    // dependency (economy/data plugins especially). This was declared in the version catalog
    // but never actually applied anywhere — genuinely unused until now.
    implementation libs.mysql.connector.j
    implementation libs.gson
    implementation libs.snakeyaml
    implementation libs.adventure.api
    implementation libs.adventure.text.minimessage
    implementation libs.adventure.text.serializer.gson
    implementation libs.adventure.text.serializer.legacy
    implementation libs.adventure.text.serializer.plain

    implementation 'net.kyori:option:1.0.0'
    implementation libs.json.simple
    implementation libs.commons.lang

    implementation 'org.apache.maven.resolver:maven-resolver-api:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-util:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-impl:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-supplier:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-connector-basic:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-transport-http:1.9.18'
    implementation 'org.apache.maven.resolver:maven-resolver-transport-file:1.9.18'
    implementation 'org.apache.maven:maven-resolver-provider:3.9.6'
    implementation 'org.apache.maven:maven-model-builder:3.9.6'
    implementation 'org.apache.maven:maven-model:3.9.6'
    implementation 'org.apache.maven:maven-artifact:3.9.6'
    implementation 'org.apache.maven:maven-builder-support:3.9.6'
    implementation 'org.apache.maven:maven-repository-metadata:3.9.6'
    implementation 'org.codehaus.plexus:plexus-utils:3.5.1'
    implementation 'org.codehaus.plexus:plexus-interpolation:1.26'
    implementation 'javax.inject:javax.inject:1'
    implementation 'org.eclipse.sisu:org.eclipse.sisu.inject:0.9.0.M2'
    implementation 'commons-logging:commons-logging:1.2'
}

def generatedVersionsDir = layout.buildDirectory.dir('generated/versions')
def versionsFile = generatedVersionsDir.map { it.file('lunararc-launcher.properties').asFile }
sourceSets.main.resources.srcDir(generatedVersionsDir)

tasks.register('generateVersions') {
    outputs.file versionsFile
    doLast {
        def versionsTarget = versionsFile.get()
        versionsTarget.parentFile.mkdirs()
        def props = new Properties()
        props['projectName']     = rootProject.name
        props['version']         = project.version.toString()
        props['buildNumber']     = rootProject.ext.lunarArcBuildNumber
        props['minecraft']       = libs.versions.minecraft.get()
        props['neoforge']        = libs.versions.neoforge.get()
        props['forge']           = libs.versions.forge.get()
        props['fabric']          = libs.versions.fabric.loader.get()
        props['fabricInstaller'] = libs.versions.fabric.installer.get()
        props['quilt']           = libs.versions.quilt.loader.get()
        props['quiltInstaller']  = libs.versions.quilt.installer.get()
        props['paperBuild']      = libs.versions.paper.build.get()
        props['paperApi']        = libs.versions.paper.api.get()
        props['dataVersion']     = libs.versions.data.version.get()
        props['buildName']       = libs.versions.build.name.get()
        props['javaVersion']     = libs.versions.java.runtime.get()
        props['buildDate']       = new java.text.SimpleDateFormat('dd-MM-yyyy HH:mm').format(new Date())
        // Recorded so a log or a crash report identifies the exact source it was built from. A
        // report that says only "LunarArc" cannot be matched to a commit, which is most of what a
        // bug report from a stranger needs to be actionable.
        props['gitHash']         = rootProject.ext.gitHash
        props['gitBranch']       = rootProject.ext.gitBranch
        versionsTarget.text = ''
        props.store(versionsTarget.newWriter(), null)
    }
}

processResources.dependsOn 'generateVersions'

jar {
    manifest {
        attributes(
            'Main-Class':           'io.ampznetwork.lunararc.launcher.Launcher',
            'Premain-Class':        'io.ampznetwork.lunararc.launcher.LunarArcAgent',
            'Can-Retransform-Classes': 'true',
            'Can-Append-To-Class-Path': 'true'
        )
    }
}

def createFatJar(String platform) {

    def ShadowJar = tasks.named('shadowJar').type
    tasks.register("${platform}Jar", ShadowJar) {

        configurations = []
        if (platform == 'forge') dependsOn rootProject.tasks.named('verifyNoRuntimeProxies')
        def cleanVersion = project.version.toString()
        archiveBaseName.set("${rootProject.name.toLowerCase(Locale.ROOT).replaceAll('[^a-z0-9._-]+', '-')}-${platform}")
        archiveVersion.set(cleanVersion)
        archiveClassifier.set('')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        relocate 'com.google.gson',         'io.ampznetwork.lunararc.libs.gson'

        doLast {
            File output = archiveFile.get().asFile
            File repaired = new File(temporaryDir, 'native-gson.jar')
            def remapper = new org.objectweb.asm.commons.Remapper() {
                @Override
                String map(String name) {
                    String prefix = 'io/ampznetwork/lunararc/libs/gson/'
                    return name.startsWith(prefix) ? 'com/google/gson/' + name.substring(prefix.length()) : name
                }
            }
            new java.util.jar.JarFile(output).withCloseable { input ->
                new java.util.jar.JarOutputStream(new FileOutputStream(repaired)).withCloseable { target ->
                    input.entries().each { entry ->
                        byte[] bytes = input.getInputStream(entry).withCloseable { it.readAllBytes() }
                        if (entry.name.endsWith('.class')
                                && !entry.name.startsWith('io/ampznetwork/lunararc/launcher/')
                                && !entry.name.startsWith('io/ampznetwork/lunararc/i18n/')
                                && !entry.name.startsWith('io/ampznetwork/lunararc/libs/gson/')) {
                            def writer = new org.objectweb.asm.ClassWriter(0)
                            new org.objectweb.asm.ClassReader(bytes).accept(
                                    new org.objectweb.asm.commons.ClassRemapper(writer, remapper), 0)
                            bytes = writer.toByteArray()
                        }
                        def copy = new java.util.jar.JarEntry(entry.name)
                        copy.time = entry.time
                        target.putNextEntry(copy)
                        target.write(bytes)
                        target.closeEntry()
                    }
                }
            }
            java.nio.file.Files.move(repaired.toPath(), output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }

        relocate 'org.apache.maven',         'io.ampznetwork.lunararc.libs.maven.core'
        relocate 'org.codehaus.plexus',      'io.ampznetwork.lunararc.libs.maven.plexus'
        relocate 'org.eclipse.sisu',         'io.ampznetwork.lunararc.libs.maven.sisu'
        relocate 'javax.inject',             'io.ampznetwork.lunararc.libs.maven.inject'
        relocate 'org.apache.http',          'io.ampznetwork.lunararc.libs.maven.http'
        relocate 'org.apache.commons.codec', 'io.ampznetwork.lunararc.libs.maven.codec'
        relocate 'org.apache.commons.logging','io.ampznetwork.lunararc.libs.maven.logging'

        def platformProjectMap = [
            neoforge: ':lunararc-neoforge',
            forge:    ':lunararc-forge',
            fabric:   ':lunararc-fabric',
            quilt:    ':lunararc-quilt'
        ]
        def platformProject = project(platformProjectMap[platform])

        def platformJarTask = platformProject.tasks.findByName('remapJar')
        if (platformJarTask == null || !platformJarTask.enabled) {
            platformJarTask = platformProject.tasks.findByName('jar')
        }

        def commonTaskName = platform == 'neoforge'
            ? 'transformProductionNeoForge'
            : "transformProduction${platform.capitalize()}"
        def commonJarTask = project(':lunararc-common').tasks.findByName(commonTaskName)

        // The mod metadata files are templates - fabric.mod.json and quilt.mod.json carry
        // ${version}, ${minecraft} and friends - and only processResources expands them. Depending
        // on the processResources tasks, and copying from their output below rather than from the
        // source directories, is what makes the shipped jar carry real values.
        def commonResources = project(':lunararc-common').tasks.named('processResources')
        def platformResources = platformProject.tasks.named('processResources')
        def bootstrapResources = tasks.named('processResources')
        dependsOn commonJarTask, platformJarTask, 'generateVersions',
                commonResources, platformResources, bootstrapResources

        // transformProduction* is Architectury's bytecode transformer, and its output is still in
        // the named (Mojang) namespace - Loom's remapJar, in the platform project, is what puts
        // classes into the loader's namespace. Only NeoForge runs on Mojang names at runtime, so
        // only there is the transformer output already the right thing to ship.
        //
        // Forge (SRG), Fabric and Quilt (intermediary) all bundle lunararc-common into their
        // shadowJar so remapJar remaps common and platform classes in one pass. Copying the named
        // transformer output in first defeated that entirely: duplicatesStrategy is EXCLUDE, so
        // the first copy of a path wins and the un-remapped classes were the ones that shipped.
        // On Fabric that surfaced as "@Mixin target net.minecraft.server.commands.EffectCommands
        // was not found" - the Mojang name of a class the loader only knows as an intermediary
        // one - and on Forge it would have been the same story one step later, as NoSuchMethodError
        // against SRG member names. Take the remapped platform JAR whole on those platforms.
        boolean commonRemappedIntoPlatformJar = platform != 'neoforge'

        if (commonRemappedIntoPlatformJar) {

            from(zipTree(platformJarTask.outputs.files.singleFile)) {
                exclude 'META-INF/MANIFEST.MF'
                exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
            }
        } else {

            from(zipTree(commonJarTask.outputs.files.singleFile)) {
                exclude 'mixins.lunararc.common.json'
                exclude 'mixins.lunararc.common.refmap.json'
            }

            from(project(':lunararc-common').file('src/main/resources/mixins.lunararc.common.json')) {
                filter { String line ->
                    if (line.contains('\"refmap\"')) return null
                    if (line.contains('core.entity.SlimeAttackGoalMixin')) return null
                    if (line.contains('core.entity.SlimeFloatGoalMixin')) return null
                    if (line.contains('core.entity.SlimeRandomDirectionGoalMixin')) return null
                    if (line.contains('core.entity.SlimeKeepOnJumpingGoalMixin')) return null
                    if (line.contains('core.effect.HungerMobEffectMixin')) return null
                    return line
                }
            }

            from(zipTree(platformJarTask.outputs.files.singleFile)) {
                include 'io/ampznetwork/lunararc/**'
                include 'META-INF/neoforge.mods.toml'
                include 'META-INF/mods.toml'
            }
        }

        from project(':installer').sourceSets.main.output
        from project(':lunararc-api').sourceSets.main.output
        from project(':i18n-config').sourceSets.main.output
        // These take the processed resource output, not src/main/resources. Reading the source
        // directory shipped fabric.mod.json and quilt.mod.json with their ${...} placeholders
        // intact, so Fabric read the mod's version as the literal string "${version}" and refused
        // to load it: "requires version ${fabric_loader} of mod 'Fabric Loader', but only the
        // wrong version is present: 0.19.5". The same file arrives processed from the platform jar
        // above, and which of the two won was left to the copy's duplicate handling.
        // The mixin config and its refmap are deliberately never taken from here: NeoForge gets the
        // filtered copy written above, and the remapped platforms must keep the copy remapJar
        // rewrote for their namespace. Everything else in common's resources is namespace-neutral.
        from(project(':lunararc-common').sourceSets.main.output.resourcesDir) {
            exclude 'mixins.lunararc.common.json'
            exclude 'mixins.lunararc.common.refmap.json'
        }
        from platformProject.sourceSets.main.output.resourcesDir
        from sourceSets.main.output.resourcesDir

        project.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id

            if (id.group == 'io.ampznetwork.lunararc') return

            def providedByPlatform = id.group.startsWith('org.apache.commons') ||
                (id.group.startsWith('org.apache.maven') && !(id.group == 'org.apache.maven.resolver' || id.group == 'org.apache.maven')) ||
                id.group.startsWith('org.apache.logging') ||
                id.group.startsWith('org.slf4j') ||
                id.group.startsWith('com.google.guava') ||
                id.group.startsWith('com.google.code.findbugs') ||
                id.group.startsWith('com.google.errorprone') ||
                id.group.startsWith('org.checkerframework') ||
                id.group.startsWith('com.mojang') ||
                id.group.startsWith('it.unimi.dsi') ||
                id.group.startsWith('org.joml') ||
                id.group.startsWith('org.ow2.asm') ||
                id.group.startsWith('net.minecraft')
            if (providedByPlatform) return

            if (platform == 'neoforge' && (id.group == 'net.fabricmc' || id.group == 'org.quiltmc')) return
            if (platform == 'fabric'   && (id.group == 'net.neoforged' || id.group == 'org.quiltmc')) return
            if (platform == 'quilt'    && (id.group == 'net.neoforged' || id.group == 'net.fabricmc')) return
            if (platform == 'forge'    && (id.group == 'net.neoforged' || id.group == 'net.fabricmc' || id.group == 'org.quiltmc')) return

            boolean lunarArcKyori = id.group.startsWith('net.kyori') &&
                (id.name.startsWith('adventure-') || id.name.startsWith('examination-') || id.name == 'option')

            if (id.group.startsWith('net.kyori') && !lunarArcKyori) return

            if (id.group == 'commons-lang' && id.name == 'commons-lang') {
                from(artifact.file) {
                    into 'META-INF/lunararc-libs'
                    rename { 'commons-lang-2.6.jar' }
                }
                return
            }

            boolean flatten = (id.group == 'io.papermc.paper' && id.name == 'paper-api') ||

                id.group == 'org.apache.maven.resolver' ||
                id.group == 'org.apache.maven' ||
                id.group == 'org.codehaus.plexus' ||
                id.group == 'javax.inject' ||
                id.group == 'org.eclipse.sisu' ||
                id.group == 'org.apache.httpcomponents' ||
                id.group == 'commons-codec' ||
                id.group == 'commons-logging' ||
                lunarArcKyori ||
                id.group.contains('net.md-5') ||
                id.group == 'com.google.code.gson' ||
                (id.group == 'com.googlecode.json-simple' && id.name == 'json-simple') ||
                (id.group == 'org.yaml' && id.name == 'snakeyaml') ||
                (id.group == 'org.xerial' && id.name == 'sqlite-jdbc') ||
                (id.group == 'com.mysql' && id.name == 'mysql-connector-j') ||
                id.group == 'org.spongepowered' ||
                id.group == 'io.leangen.geantyref'

            if (flatten) {
                from(zipTree(artifact.file)) {
                    exclude 'META-INF/MANIFEST.MF'
                    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
                    exclude 'org/bukkit/plugin/java/JavaPlugin.class'
                    exclude 'org/bukkit/plugin/java/JavaPlugin$*.class'
                    exclude 'org/bukkit/plugin/SimplePluginManager.class'
                }
            } else {

                from(artifact.file) {
                    into "META-INF/libraries/${id.group.replace('.', '/')}/${id.name}/${id.version}"
                }
            }
        }

        exclude 'io/ampznetwork/lunararc/common/server/LunarArcPluginLibraryRuntime.class'
        exclude 'io/ampznetwork/lunararc/common/server/LunarArcPluginLibraryRuntime$*.class'

        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        mergeServiceFiles()

        manifest {
            attributes(
                'Main-Class':              'io.ampznetwork.lunararc.launcher.Launcher',
                'Premain-Class':           'io.ampznetwork.lunararc.launcher.LunarArcAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Append-To-Class-Path': 'true',
                'LunarArc-Platform':       platform,
                'Implementation-Version':  project.version
            )
        }
    }

    tasks.register("verify${platform.capitalize()}HybridShape") {
        if (platform == 'neoforge') dependsOn ':lunararc-common:runPackagedRecipeRegression'
        dependsOn rootProject.tasks.named('verifyNoRuntimeProxies')
        dependsOn tasks.named("${platform}Jar")
        inputs.file(tasks.named("${platform}Jar").flatMap { it.archiveFile })
        doLast {
            File hybridJar = tasks.named("${platform}Jar").get().archiveFile.get().asFile
            List<String> forbiddenNms = new ArrayList<>()
            List<String> forbiddenPaperServer = new ArrayList<>()
            Set<String> entries = new HashSet<>()
            new java.util.jar.JarFile(hybridJar).withCloseable { jar ->
                jar.entries().each { entry ->
                    if (entry.directory) return
                    entries.add(entry.name)
                    if (!entry.name.endsWith('.class')) return
                    if (!entry.name.startsWith('io/ampznetwork/lunararc/launcher/')
                            && !entry.name.startsWith('io/ampznetwork/lunararc/i18n/')
                            && !entry.name.startsWith('io/ampznetwork/lunararc/libs/gson/')) {
                        String bytecode = jar.getInputStream(entry).withCloseable {
                            new String(it.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                        }
                        if (bytecode.contains('io/ampznetwork/lunararc/libs/gson/')) {
                            throw new GradleException("Runtime class still uses private launcher Gson: ${entry.name}")
                        }
                    }
                    if (entry.name.startsWith('net/minecraft/')) forbiddenNms.add(entry.name)

                    boolean paperServerOnly =
                        entry.name.startsWith('io/papermc/paper/chunk/system/') ||
                        entry.name.startsWith('io/papermc/paper/threadedregions/RegionizedServer') ||
                        entry.name.startsWith('io/papermc/paper/threadedregions/scheduler/FallbackRegionScheduler') ||
                        entry.name.startsWith('io/papermc/paper/threadedregions/scheduler/FoliaAsyncScheduler') ||
                        entry.name.startsWith('io/papermc/paper/threadedregions/scheduler/FoliaEntityScheduler') ||
                        entry.name.startsWith('io/papermc/paper/threadedregions/scheduler/FoliaGlobalRegionScheduler')
                    if (paperServerOnly) {
                        forbiddenPaperServer.add(entry.name)
                    }
                }
            }
            if (!forbiddenNms.isEmpty()) {
                throw new GradleException("${platform} hybrid JAR contains ${forbiddenNms.size()} net.minecraft classes. Minecraft must stay loader-owned.")
            }
            if (!forbiddenPaperServer.isEmpty()) {
                throw new GradleException("${platform} hybrid JAR contains copied Paper server implementation classes. Paper is an API/merge reference, not a second server runtime.")
            }

            Set<String> expectedCraftSurface = new HashSet<>()
            File paperReference = rootProject.ext.paperServerJar
            if (!paperReference.isFile()) {
                throw new GradleException("Paper 1.21.1 compile/reference JAR is missing during ${platform} surface verification")
            }
            new java.util.jar.JarFile(paperReference).withCloseable { paperJar ->
                paperJar.entries().each { entry ->
                    if (entry.directory || !entry.name.endsWith('.class')) return
                    if (!(entry.name.startsWith('org/bukkit/craftbukkit/') || entry.name.startsWith('org/spigotmc/'))) return

                    int dollar = entry.name.indexOf('$')
                    if (dollar >= 0) {
                        String ownerEntry = entry.name.substring(0, dollar) + '.class'
                        String ownerSource = ownerEntry.substring(0, ownerEntry.length() - '.class'.length()) + '.java'
                        File lunarArcOwner = rootProject.file("lunararc-common/src/main/java/${ownerSource}")
                        if (lunarArcOwner.isFile()) return
                    }

                    expectedCraftSurface.add(entry.name)
                }
            }
            List<String> missingCraftSurface = expectedCraftSurface.findAll { !entries.contains(it) }.sort()
            if (!missingCraftSurface.isEmpty()) {
                throw new GradleException(
                    "${platform} hybrid JAR is missing ${missingCraftSurface.size()} exact Paper 1.21.1 CraftBukkit/Spigot implementation classes. " +
                    "First missing entries: ${missingCraftSurface.take(25)}"
                )
            }
            logger.lifecycle(
                "${platform} exact Paper 1.21.1 CraftBukkit/Spigot class surface: ${expectedCraftSurface.size()} / ${expectedCraftSurface.size()} present"
            )

            List<String> requiredPluginLibraryRuntime = [
                'org/eclipse/aether/artifact/Artifact.class',
                'org/eclipse/aether/artifact/DefaultArtifact.class',
                'org/eclipse/aether/graph/Dependency.class',
                'org/eclipse/aether/repository/RemoteRepository.class',
                'org/eclipse/aether/RepositorySystem.class',
                'io/ampznetwork/lunararc/libs/maven/core/repository/internal/MavenRepositorySystemUtils.class',
                'io/ampznetwork/lunararc/libs/maven/inject/Inject.class',
                'io/ampznetwork/lunararc/libs/maven/http/client/HttpClient.class'
            ]
            List<String> missingPluginLibraryRuntime = requiredPluginLibraryRuntime.findAll { !entries.contains(it) }
            if (!missingPluginLibraryRuntime.isEmpty()) {
                throw new GradleException("${platform} hybrid JAR is missing direct Paper plugin library runtime classes: ${missingPluginLibraryRuntime}")
            }
            if (entries.any { it.startsWith('META-INF/lunararc/plugin-runtime-libs/') }) {
                throw new GradleException("${platform} hybrid JAR still contains the retired nested Paper PluginLoader runtime")
            }
            if (entries.contains('io/ampznetwork/lunararc/common/server/LunarArcPluginLibraryRuntime.class')) {
                throw new GradleException("${platform} hybrid JAR still contains the retired LunarArcPluginLibraryRuntime class")
            }

            List<String> requiredLunarArcRuntimeResources = [
                'io/ampznetwork/lunararc/i18n/TranslationManager.class',
                'locale/en_gb.json'
            ]
            List<String> missingLunarArcRuntimeResources = requiredLunarArcRuntimeResources.findAll { !entries.contains(it) }
            if (!missingLunarArcRuntimeResources.isEmpty()) {
                throw new GradleException("${platform} hybrid JAR is missing LunarArc runtime resources: ${missingLunarArcRuntimeResources}")
            }

            // Two checks against faults that are invisible until the server is running.
            //
            // A loader whose metadata does not name mixins.lunararc.common.json applies none of the
            // common layer, so the server boots normally and simply has no Bukkit in it and loads no
            // plugins. That was true of Forge, and nothing in the build noticed.
            //
            // And metadata copied from src/main/resources rather than the processResources output
            // still holds its ${...} placeholders, which Fabric reports as a version conflict
            // against a version string that is a literal placeholder.
            String metadataEntry = [
                neoforge: 'META-INF/neoforge.mods.toml',
                forge:    'META-INF/mods.toml',
                fabric:   'fabric.mod.json',
                quilt:    'quilt.mod.json'
            ][platform]

            if (!entries.contains(metadataEntry)) {
                throw new GradleException("${platform} hybrid JAR is missing its loader metadata ${metadataEntry}")
            }
            if (!entries.contains('mixins.lunararc.common.json')) {
                throw new GradleException("${platform} hybrid JAR is missing mixins.lunararc.common.json")
            }

            String metadata = new java.util.jar.JarFile(hybridJar).withCloseable { jar ->
                jar.getInputStream(jar.getEntry(metadataEntry)).getText('UTF-8')
            }
            if (!metadata.contains('mixins.lunararc.common.json')) {
                throw new GradleException(
                    "${platform} loader metadata (${metadataEntry}) does not declare mixins.lunararc.common.json. " +
                    "Without it the common mixins never apply: the server starts, and has no Bukkit layer and no plugins.")
            }
            def placeholder = metadata =~ /\$\{[A-Za-z_][A-Za-z0-9_]*\}/
            if (placeholder) {
                throw new GradleException(
                    "${platform} loader metadata (${metadataEntry}) still contains unexpanded placeholders " +
                    "(${placeholder[0]}). The jar packaged the template from src/main/resources instead of the " +
                    "processResources output.")
            }

            logger.lifecycle("${platform} hybrid ownership/runtime audit passed: loader-owned Minecraft, no copied Paper server runtime, direct Paper library resolver and locale resources packaged, ${metadataEntry} declares the common mixin config with no unexpanded placeholders.")
        }
    }
}

['neoforge', 'forge', 'fabric', 'quilt'].each { createFatJar(it) }
