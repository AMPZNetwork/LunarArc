// gradle/incompatible/plugins.json and mods.json are the editable build-time sources. They are
// validated here and baked into the jar as compact TSV resources, so a running server has no
// external blocked-list file that can be edited or removed to bypass the checks. Unknown keys,
// malformed JSON, blank required values, and duplicate entries fail the build instead of being
// silently ignored.
def generatedIncompatibleDir = layout.buildDirectory.dir('generated/incompatible')

tasks.register('generateIncompatibleList') {
    def pluginsSource = rootProject.file('gradle/incompatible/plugins.json')
    def modsSource = rootProject.file('gradle/incompatible/mods.json')
    def pluginsOutput = generatedIncompatibleDir.map { it.file('lunararc/incompatible/plugins.tsv').asFile }
    def modsOutput = generatedIncompatibleDir.map { it.file('lunararc/incompatible/mods.tsv').asFile }
    inputs.files(pluginsSource, modsSource)
    outputs.files(pluginsOutput, modsOutput)

    doLast {
        def parseList = { File source, String rootKey, String idKey ->
            def parsed
            try {
                parsed = new groovy.json.JsonSlurper().parse(source)
            } catch (Exception error) {
                throw new GradleException("${rootProject.relativePath(source)} is not valid JSON", error)
            }
            if (!(parsed instanceof Map) || parsed.keySet() != ([rootKey] as Set)) {
                throw new GradleException("${rootProject.relativePath(source)} must contain exactly one top-level key: '${rootKey}'")
            }
            def entries = parsed[rootKey]
            if (!(entries instanceof List)) {
                throw new GradleException("${rootProject.relativePath(source)}: '${rootKey}' must be an array")
            }

            Set<String> seen = new HashSet<>()
            List<String> rows = []
            entries.eachWithIndex { entry, index ->
                if (!(entry instanceof Map)) {
                    throw new GradleException("${rootProject.relativePath(source)}: ${rootKey}[${index}] must be an object")
                }
                Set<String> allowed = [idKey, 'version', 'reason'] as Set
                def unknown = entry.keySet().findAll { !allowed.contains(it) }
                if (!unknown.isEmpty()) {
                    throw new GradleException("${rootProject.relativePath(source)}: ${rootKey}[${index}] has unknown key(s): ${unknown.join(', ')}")
                }
                String id = entry[idKey]?.toString()?.trim()
                String reason = entry.reason?.toString()?.trim()
                String version = entry.version == null ? null : entry.version.toString().trim()
                if (!id) throw new GradleException("${rootProject.relativePath(source)}: ${rootKey}[${index}] requires '${idKey}'")
                if (!reason) throw new GradleException("${rootProject.relativePath(source)}: ${rootKey}[${index}] '${id}' requires 'reason'")
                if (entry.containsKey('version') && !version) {
                    throw new GradleException("${rootProject.relativePath(source)}: ${rootKey}[${index}] '${id}' has a blank version")
                }
                if (id.contains('\t') || reason.contains('\t') || (version != null && version.contains('\t'))) {
                    throw new GradleException("${rootProject.relativePath(source)}: tabs are not allowed in incompatible fields")
                }
                String duplicateKey = id.toLowerCase(java.util.Locale.ROOT) + '\u0000' + (version ?: '*')
                if (!seen.add(duplicateKey)) {
                    throw new GradleException("${rootProject.relativePath(source)}: duplicate ${idKey} '${id}'${version ? " version '${version}'" : ''}")
                }
                rows << "${id}\t${version ?: ''}\t${reason}"
            }
            return rows
        }

        List<String> pluginRows = parseList(pluginsSource, 'plugins', 'main')
        List<String> modRows = parseList(modsSource, 'mods', 'modId')
        File pluginsTarget = pluginsOutput.get()
        File modsTarget = modsOutput.get()
        pluginsTarget.parentFile.mkdirs()
        modsTarget.parentFile.mkdirs()
        pluginsTarget.setText(pluginRows.isEmpty() ? '' : pluginRows.join('\n') + '\n', 'UTF-8')
        modsTarget.setText(modRows.isEmpty() ? '' : modRows.join('\n') + '\n', 'UTF-8')
        logger.lifecycle("Generated LunarArc incompatible resources with ${pluginRows.size()} plugin and ${modRows.size()} mod entries")
    }
}
