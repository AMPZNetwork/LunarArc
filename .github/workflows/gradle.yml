# This workflow will build a Java project with Gradle
# For more information see: https:

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Read Java runtime requirement
        id: java-runtime
        shell: bash
        run: |
          java_runtime=$(awk -F '=' '/^java-runtime[[:space:]]*=/ {gsub(/[ "\r]/, "", $2); print $2; exit}' gradle/libs.versions.toml)
          test -n "$java_runtime" || { echo "java-runtime is missing from gradle/libs.versions.toml" >&2; exit 1; }
          echo "version=$java_runtime" >> "$GITHUB_OUTPUT"

      - name: Set up required JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '${{ steps.java-runtime.outputs.version }}'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          cache-read-only: false

      - name: Cache Loom / compile reference setup
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .gradle/loom-cache
            .gradle/quilt-loom-cache
            .gradle/paper
            lunararc-neoforge/.gradle
            lunararc-fabric/.gradle
            lunararc-forge/.gradle
            lunararc-quilt/.gradle
          key: loom-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            loom-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Assemble
        run: ./gradlew clean preparePaperCompileReference hybridBuild collect --no-daemon --stacktrace

      - name: List Artifacts
        run: ls -R build/libs

      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: LunarArc
          path: build/libs
